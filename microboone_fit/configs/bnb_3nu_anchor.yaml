analysis_name: "bnb_four_channel_3nu_nominal_anchor"
model: "3+1 short-baseline parameterization at the zero-mixing 3nu limit"
channels: ["nue_cc_fc", "nue_cc_pc", "numu_cc_fc", "numu_cc_pc"]
baseline_km: 0.4685
baseline_interpretation: "BNB proton target to MicroBooNE detector distance stated by the 2025 paper; single-baseline approximation"
reference_parameters:
  delta_m2_41_eV2: 1.2
  sin2_theta14: 0.0
  sin2_theta24: 0.0
reference_coordinate_note: "The HEPData nominal Signal + Background spectrum is anchored at zero sterile mixing. delta_m2_41_eV2 is physically irrelevant at this zero-amplitude boundary."
paper_figure1_illustrative_point:
  delta_m2_41_eV2: 1.2
  labelled_sin2_2theta_mue: 0.003
  sin2_theta24: 0.018
  note: "Illustrative degeneracy point only; not the paper best fit and not the HEPData nominal anchor."
statistical_treatment: "Pearson statistical covariance evaluated at each current prediction"
systematic_covariance_evolution: "reference absolute covariance rescaled by the outer product of current/reference total-prediction ratios"
kernel_directory: "data/anchor/bnb_reference_reweight_kernel"
interpretation: "HEPData nominal Signal + Background is assigned to the zero-sterile-mixing 3nu limit; published Background is frozen and added once"
